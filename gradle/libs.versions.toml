[versions]
# ── Core toolchain ────────────────────────────────────────────────────────────
agp     = "8.5.2"
kotlin  = "2.0.21"
ksp     = "2.0.21-1.0.28"

# ── AndroidX ──────────────────────────────────────────────────────────────────
core-ktx   = "1.15.0"
lifecycle  = "2.8.7"

# ── Compose ───────────────────────────────────────────────────────────────────
compose-bom = "2024.11.00"
navigation-compose = "2.8.4"

# ── Dependency Injection ──────────────────────────────────────────────────────
hilt                    = "2.52"
hilt-navigation-compose = "1.2.0"

# ── Persistence ───────────────────────────────────────────────────────────────
room = "2.6.1"

# ── Coroutines ────────────────────────────────────────────────────────────────
coroutines = "1.9.0"

# ── Serialization (preparado para sincronización futura) ─────────────────────
kotlinx-serialization = "1.7.3"

# ── Testing ───────────────────────────────────────────────────────────────────
junit     = "4.13.2"
junit-ext = "1.2.1"
espresso  = "3.6.1"

# =============================================================================
[libraries]

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ── Android Core ──────────────────────────────────────────────────────────────
androidx-core-ktx              = { group = "androidx.core",      name = "core-ktx",               version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",  version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# ── Compose BOM (gestiona versiones de todas las libs Compose) ────────────────
compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest   = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4     = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Navigation ────────────────────────────────────────────────────────────────
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt-android          = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing  = { group = "com.google.dagger", name = "hilt-android-testing",  version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# ── Room ──────────────────────────────────────────────────────────────────────
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }
room-testing  = { group = "androidx.room", name = "room-testing",   version.ref = "room" }

# ── Testing ───────────────────────────────────────────────────────────────────
junit         = { group = "junit",              name = "junit",         version.ref = "junit" }
junit-ext     = { group = "androidx.test.ext",  name = "junit",         version.ref = "junit-ext" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# =============================================================================
[bundles]
coroutines = ["kotlinx-coroutines-android", "kotlinx-coroutines-core"]
compose    = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3"]
lifecycle  = ["androidx-lifecycle-runtime-ktx", "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-runtime-compose"]
room       = ["room-runtime", "room-ktx"]

# =============================================================================
[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",              version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                     version.ref = "ksp" }
